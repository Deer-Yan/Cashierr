<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Kasir Toko</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script>window.CURRENT_PAGE = 'dashboard.html';</script>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <strong>Kasir Toko</strong>
      <span id="sidebarRoleLabel"></span>
    </div>
    <nav id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser"></div>
      <button class="btn btn-danger btn-block" id="logoutBtn">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="hamburger" id="hamburger">Menu</button>
        <div>
          <h2>Dashboard</h2>
          <p>Ringkasan aktivitas toko Anda hari ini</p>
        </div>
      </div>
    </div>

    <div class="grid grid-4" style="margin-bottom:20px;">
      <div class="card stat-card">
        <div class="value" id="statOmzet">Rp 0</div>
        <div class="label">Omzet Hari Ini</div>
      </div>
      <div class="card stat-card">
        <div class="value" id="statTransaksi">0</div>
        <div class="label">Transaksi Hari Ini</div>
      </div>
      <div class="card stat-card">
        <div class="value" id="statBarang">0</div>
        <div class="label">Total Barang</div>
      </div>
      <div class="card stat-card">
        <div class="value" id="statLowStock">0</div>
        <div class="label">Stok Menipis</div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h3 style="margin-top:0; font-size:14px;">Stok Menipis</h3>
        <div id="lowStockList"><p style="color:var(--text-muted); font-size:13.5px;">Memuat...</p></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0; font-size:14px;">Barang Terlaris</h3>
        <div id="topBarangList"><p style="color:var(--text-muted); font-size:13.5px;">Memuat...</p></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
async function loadDashboard() {
  const res = await apiJson('api/dashboard_summary.php');
  if (!res.success) return;
  const d = res.data;
  document.getElementById('statOmzet').textContent = formatRupiah(d.omzet_hari_ini);
  document.getElementById('statTransaksi').textContent = d.jumlah_transaksi_hari_ini;
  document.getElementById('statBarang').textContent = d.total_barang;
  document.getElementById('statLowStock').textContent = d.low_stock.length;

  const lowStockEl = document.getElementById('lowStockList');
  if (d.low_stock.length === 0) {
    lowStockEl.innerHTML = '<p style="color:var(--text-muted); font-size:13.5px;">Semua stok aman</p>';
  } else {
    lowStockEl.innerHTML = d.low_stock.map(b => `
      <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
        <span>${b.nama_barang}</span>
        <span class="badge ${b.stok == 0 ? 'badge-danger' : 'badge-warning'}">${b.stok} tersisa</span>
      </div>
    `).join('');
  }

  const topEl = document.getElementById('topBarangList');
  if (d.top_barang.length === 0) {
    topEl.innerHTML = '<p style="color:var(--text-muted); font-size:13.5px;">Belum ada penjualan</p>';
  } else {
    topEl.innerHTML = d.top_barang.map((b, i) => `
      <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
        <span>${i + 1}. ${b.nama_barang}</span>
        <span style="font-weight:700; color:var(--primary);">${b.total_terjual} terjual</span>
      </div>
    `).join('');
  }
}

(async () => {
  const user = await initProtectedPage();
  if (!user) return;
  loadDashboard();
})();
</script>
</body>
</html>
