<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Toko - Masuk</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Kasir Toko</h1>
      <p id="authSubtitle">Masuk ke akun toko Anda</p>
    </div>

    <div class="alert alert-error" id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="nama@toko.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Masuk</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none">
      <div class="field">
        <label>Nama Pengguna</label>
        <input type="text" id="regNama" required placeholder="Budi Santoso">
      </div>
      <div class="field">
        <label>Nama Toko</label>
        <input type="text" id="regToko" required placeholder="Toko Sejahtera">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" required placeholder="nama@toko.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPassword" required placeholder="Minimal 6 karakter">
      </div>
      <button type="submit" class="btn btn-primary" id="registerBtn">Daftar</button>
    </form>

    <div class="auth-switch">
      <span id="switchText">Belum punya akun? <a href="#" id="switchToRegister">Daftar di sini</a></span>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script>
const alertError = document.getElementById('alertError');
const alertSuccess = document.getElementById('alertSuccess');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const switchText = document.getElementById('switchText');
const authSubtitle = document.getElementById('authSubtitle');

function showError(msg) {
  alertSuccess.classList.remove('show');
  alertError.textContent = msg;
  alertError.classList.add('show');
}
function showSuccess(msg) {
  alertError.classList.remove('show');
  alertSuccess.textContent = msg;
  alertSuccess.classList.add('show');
}
function clearAlerts() {
  alertError.classList.remove('show');
  alertSuccess.classList.remove('show');
}

function toggleMode(toRegister) {
  clearAlerts();
  loginForm.style.display = toRegister ? 'none' : 'block';
  registerForm.style.display = toRegister ? 'block' : 'none';
  authSubtitle.textContent = toRegister ? 'Buat akun toko baru' : 'Masuk ke akun toko Anda';
  switchText.innerHTML = toRegister
    ? 'Sudah punya akun? <a href="#" id="switchToLogin">Masuk di sini</a>'
    : 'Belum punya akun? <a href="#" id="switchToRegister">Daftar di sini</a>';
  document.getElementById(toRegister ? 'switchToLogin' : 'switchToRegister')
    .addEventListener('click', (e) => { e.preventDefault(); toggleMode(!toRegister); });
}

document.getElementById('switchToRegister').addEventListener('click', (e) => {
  e.preventDefault();
  toggleMode(true);
});

// Jika sudah login, langsung lempar sesuai role (admin -> dashboard, staff -> penjualan)
(async () => {
  try {
    const res = await fetch(API_BASE + '/api/me.php', { credentials: 'include' });
    const data = await res.json();
    if (data.success) {
      window.location.href = data.data.role === 'admin' ? 'dashboard.html' : 'penjualan.html';
    }
  } catch (err) { /* belum login, tetap di halaman ini */ }
})();

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlerts();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Memproses...';
  try {
    const res = await fetch(API_BASE + '/api/login.php', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      })
    });
    const data = await res.json();
    if (data.success) {
      sessionStorage.removeItem('kt_redirect_count');
      window.location.href = data.data.role === 'admin' ? 'dashboard.html' : 'penjualan.html';
    } else {
      showError(data.message);
    }
  } catch (err) {
    showError('Terjadi kesalahan koneksi ke server backend.');
  }
  btn.disabled = false; btn.textContent = 'Masuk';
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlerts();
  const btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.textContent = 'Memproses...';
  try {
    const res = await fetch(API_BASE + '/api/register.php', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nama_pengguna: document.getElementById('regNama').value,
        nama_toko: document.getElementById('regToko').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value
      })
    });
    const data = await res.json();
    if (data.success) {
      showSuccess(data.message);
      registerForm.reset();
      setTimeout(() => toggleMode(false), 1200);
    } else {
      showError(data.message);
    }
  } catch (err) {
    showError('Terjadi kesalahan koneksi ke server backend.');
  }
  btn.disabled = false; btn.textContent = 'Daftar';
});
</script>
</body>
</html>
