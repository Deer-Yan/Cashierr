<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Pengguna - Kasir Toko</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script>window.CURRENT_PAGE = 'pengguna.html';</script>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <strong>Kasir Toko</strong>
      <span id="sidebarRoleLabel"></span>
    </div>
    <nav id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser"></div>
      <button class="btn btn-danger btn-block" id="logoutBtn">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="hamburger" id="hamburger">Menu</button>
        <div>
          <h2>Kelola Pengguna</h2>
          <p>Tambahkan akun staff yang hanya bisa membuka halaman Penjualan</p>
        </div>
      </div>
      <button class="btn btn-primary" id="btnAddStaff">+ Tambah Pengguna</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Email</th>
              <th>Dibuat</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="staffTableBody">
            <tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-muted);">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal Tambah Pengguna -->
<div class="modal-overlay" id="staffModal">
  <div class="modal-box">
    <h3>Tambah Pengguna</h3>
    <p style="font-size:13px; color:var(--text-muted); margin-top:-8px;">Akun ini akan hanya bisa mengakses halaman Penjualan pada toko yang sama.</p>
    <form id="staffForm">
      <div class="field">
        <label>Nama</label>
        <input type="text" id="staffNama" required placeholder="Nama staff">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="staffEmail" required placeholder="staff@toko.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="staffPassword" required placeholder="Minimal 6 karakter">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" style="flex:1" id="btnCancelStaff">Batal</button>
        <button type="submit" class="btn btn-primary" style="flex:1" id="btnSubmitStaff">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
const modal = document.getElementById('staffModal');
const form = document.getElementById('staffForm');

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadStaff() {
  const res = await apiJson('api/staff_list.php');
  const tbody = document.getElementById('staffTableBody');
  if (!res.success || res.data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">Belum ada akun pengguna tambahan.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = res.data.map(u => `
    <tr>
      <td><strong>${escapeHtml(u.nama_pengguna)}</strong></td>
      <td>${escapeHtml(u.email)}</td>
      <td>${formatDateTime(u.created_at)}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteStaff(${u.id})">Hapus</button></td>
    </tr>
  `).join('');
}

document.getElementById('btnAddStaff').addEventListener('click', () => modal.classList.add('show'));
document.getElementById('btnCancelStaff').addEventListener('click', () => { modal.classList.remove('show'); form.reset(); });
modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.remove('show'); form.reset(); } });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSubmitStaff');
  btn.disabled = true; btn.textContent = 'Menyimpan...';

  const res = await apiJson('api/staff_add.php', 'POST', {
    nama_pengguna: document.getElementById('staffNama').value,
    email: document.getElementById('staffEmail').value,
    password: document.getElementById('staffPassword').value,
  });

  toast(res.message, res.success ? 'success' : 'error');
  if (res.success) {
    modal.classList.remove('show');
    form.reset();
    loadStaff();
  }
  btn.disabled = false; btn.textContent = 'Simpan';
});

window.deleteStaff = async function (id) {
  if (!confirm('Yakin ingin menghapus akun pengguna ini?')) return;
  const res = await apiJson('api/staff_delete.php', 'POST', { id });
  toast(res.message, res.success ? 'success' : 'error');
  if (res.success) loadStaff();
};

(async () => {
  const user = await initProtectedPage();
  if (!user) return;
  loadStaff();
})();
</script>
</body>
</html>
